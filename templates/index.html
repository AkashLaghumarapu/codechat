<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CodeChat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
    :root {
        --bg: #0d1117;
        --panel: #161b22;
        --panel-2: #1c2331;
        --border: #30363d;
        --text: #e6edf3;
        --muted: #8b949e;
        --green: #3fb950;
        --green-dim: #2ea043;
        --violet: #bc8cff;
        --blue: #58a6ff;
        --amber: #d29922;
    }

    * { box-sizing: border-box; }

    body {
        font-family: 'JetBrains Mono', monospace;
        background: var(--bg);
        color: var(--text);
        margin: 0;
        padding: 40px 20px;
        display: flex;
        justify-content: center;
        min-height: 100vh;
    }

    .app {
        width: 100%;
        max-width: 760px;
    }

    .titlebar {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 4px;
    }

    .dot { width: 11px; height: 11px; border-radius: 50%; }
    .dot.red { background: #ff5f56; }
    .dot.yellow { background: #ffbd2e; }
    .dot.green { background: #27c93f; }

    h1 {
        font-size: 20px;
        font-weight: 600;
        margin: 18px 0 4px;
        letter-spacing: 0.2px;
    }

    h1 .prompt-sym { color: var(--green); margin-right: 8px; }

    .subtitle {
        color: var(--muted);
        font-size: 13px;
        margin: 0 0 22px;
    }

    .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 16px 18px;
        margin-bottom: 20px;
    }

    .panel-label {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 12px;
    }

    .panel-label .num {
        color: var(--bg);
        background: var(--green);
        width: 18px;
        height: 18px;
        border-radius: 4px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        font-weight: 700;
    }

    .term-row {
        display: flex;
        align-items: center;
        background: #010409;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 10px 12px;
        gap: 8px;
    }

    .term-row .sym { color: var(--green); font-weight: 700; user-select: none; }

    #repo-input {
        flex: 1;
        background: transparent;
        border: none;
        outline: none;
        color: var(--text);
        font-family: 'JetBrains Mono', monospace;
        font-size: 13.5px;
    }

    #repo-input::placeholder { color: #4d5560; }

    #load-btn {
        background: var(--green-dim);
        color: #04140a;
        border: none;
        border-radius: 6px;
        padding: 9px 16px;
        font-family: 'JetBrains Mono', monospace;
        font-weight: 700;
        font-size: 12.5px;
        cursor: pointer;
        margin-left: 10px;
        letter-spacing: 0.3px;
        white-space: nowrap;
    }

    #load-btn:hover { background: var(--green); }
    #load-btn:disabled { background: #3a3f47; color: #7b828b; cursor: not-allowed; }

    #repo-status {
        margin-top: 10px;
        font-size: 12.5px;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 16px;
    }

    #repo-status.success { color: var(--green); }
    #repo-status.error { color: #f85149; }

    .spinner {
        width: 11px; height: 11px;
        border: 2px solid #3a3f47;
        border-top-color: var(--green);
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        display: none;
    }
    .spinner.active { display: inline-block; }

    @keyframes spin { to { transform: rotate(360deg); } }

    .chat-panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
    }

    #chat-window {
        height: 380px;
        overflow-y: auto;
        background: #010409;
        padding: 14px 0;
    }

    #chat-window::-webkit-scrollbar { width: 8px; }
    #chat-window::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .empty-state {
        color: #4d5560;
        font-size: 13px;
        padding: 16px 18px;
        line-height: 1.7;
    }
    .empty-state .line { color: var(--muted); }
    .empty-state .cursor {
        display: inline-block;
        width: 7px; height: 14px;
        background: var(--green);
        vertical-align: middle;
        animation: blink 1s step-end infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    .line-row {
        display: flex;
        padding: 3px 18px;
        font-size: 13.5px;
        line-height: 1.6;
    }

    .gutter {
        color: #30363d;
        width: 28px;
        flex-shrink: 0;
        user-select: none;
        text-align: right;
        padding-right: 12px;
        font-size: 12px;
        padding-top: 2px;
    }

    .line-content { flex: 1; white-space: pre-wrap; word-break: break-word; }

    .tag-user { color: var(--violet); font-weight: 600; }
    .tag-bot { color: var(--blue); font-weight: 600; }
    .msg-text-user { color: var(--text); }
    .msg-text-bot { color: #c9d1d9; }
    .thinking { color: var(--amber); }

    .input-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 14px;
        border-top: 1px solid var(--border);
        background: var(--panel-2);
    }

    .input-bar .sym { color: var(--blue); font-weight: 700; }

    #question-input {
        flex: 1;
        background: transparent;
        border: none;
        outline: none;
        color: var(--text);
        font-family: 'JetBrains Mono', monospace;
        font-size: 13.5px;
    }

    #question-input::placeholder { color: #4d5560; }
    #question-input:disabled { opacity: 0.5; }

    #send-btn {
        background: var(--blue);
        color: #04101f;
        border: none;
        border-radius: 6px;
        padding: 8px 16px;
        font-family: 'JetBrains Mono', monospace;
        font-weight: 700;
        font-size: 12.5px;
        cursor: pointer;
    }
    #send-btn:hover { background: #79b8ff; }
    #send-btn:disabled { background: #3a3f47; color: #7b828b; cursor: not-allowed; }

    @media (max-width: 600px) {
        .term-row, .input-bar { flex-wrap: wrap; }
        #load-btn { margin-left: 0; margin-top: 8px; width: 100%; }
    }
</style>
</head>
<body>

<div class="app">
    <div class="titlebar">
        <span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span>
    </div>
    <h1><span class="prompt-sym">&gt;</span>CodeChat</h1>
    <p class="subtitle">// ask any codebase a question, get answers with file &amp; line citations</p>

    <div class="panel">
        <div class="panel-label"><span class="num">1</span> load a repository</div>
        <div class="term-row">
            <span class="sym">$</span>
            <input type="text" id="repo-input" placeholder="git clone https://github.com/user/repo.git">
            <button id="load-btn">Load Repo</button>
        </div>
        <div id="repo-status"><span class="spinner" id="spinner"></span><span id="status-text">no repo loaded yet</span></div>
    </div>

    <div class="panel-label" style="margin-bottom:10px;"><span class="num">2</span> ask a question</div>
    <div class="chat-panel">
        <div id="chat-window">
            <div class="empty-state" id="empty-state">
                <div class="line">// load a repo above, then ask things like:</div>
                <div class="line">// "where is the auth logic handled?"</div>
                <div class="line">// "how does error handling work in this app?"<span class="cursor"></span></div>
            </div>
        </div>
        <div class="input-bar">
            <span class="sym">&gt;</span>
            <input type="text" id="question-input" placeholder="ask a question about the code..." disabled>
            <button id="send-btn" disabled>Send</button>
        </div>
    </div>
</div>

<script>
    const repoInput = document.getElementById("repo-input");
    const loadBtn = document.getElementById("load-btn");
    const repoStatus = document.getElementById("repo-status");
    const statusText = document.getElementById("status-text");
    const spinner = document.getElementById("spinner");

    const chatWindow = document.getElementById("chat-window");
    const emptyState = document.getElementById("empty-state");
    const input = document.getElementById("question-input");
    const sendBtn = document.getElementById("send-btn");

    let lineNumber = 1;

    function setStatus(text, type) {
        statusText.textContent = text;
        repoStatus.className = type || "";
    }

    async function loadRepo() {
        const repoUrl = repoInput.value.trim();
        if (!repoUrl) return;

        loadBtn.disabled = true;
        spinner.classList.add("active");
        setStatus("cloning + indexing repo... this may take a minute", "");

        try {
            const response = await fetch("/load_repo", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ repo_url: repoUrl })
            });
            const data = await response.json();

            if (data.status === "success") {
                setStatus(data.message, "success");
                chatWindow.innerHTML = "";
                lineNumber = 1;
                input.disabled = false;
                sendBtn.disabled = false;
            } else {
                setStatus("error: " + data.message, "error");
            }
        } catch (error) {
            setStatus("error: could not reach the server", "error");
        }

        spinner.classList.remove("active");
        loadBtn.disabled = false;
    }

    function addLine(tag, tagClass, text, textClass, isThinking) {
        const row = document.createElement("div");
        row.className = "line-row";
        row.innerHTML = `<div class="gutter">${lineNumber}</div><div class="line-content"><span class="${tagClass}">${tag}</span> <span class="${isThinking ? 'thinking' : textClass}">${text}</span></div>`;
        chatWindow.appendChild(row);
        chatWindow.scrollTop = chatWindow.scrollHeight;
        lineNumber++;
        return row;
    }

    function escapeHtml(str) {
        const div = document.createElement("div");
        div.textContent = str;
        return div.innerHTML;
    }

    async function sendQuestion() {
        const question = input.value.trim();
        if (!question) return;

        addLine("// you:", "tag-user", escapeHtml(question), "msg-text-user");
        input.value = "";
        sendBtn.disabled = true;
        input.disabled = true;

        const thinkingRow = addLine("/* codechat */", "tag-bot", "thinking...", "msg-text-bot", true);

        try {
            const response = await fetch("/ask", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ question: question })
            });
            const data = await response.json();
            chatWindow.removeChild(thinkingRow);
            lineNumber--;
            addLine("/* codechat */", "tag-bot", escapeHtml(data.answer), "msg-text-bot");
        } catch (error) {
            chatWindow.removeChild(thinkingRow);
            lineNumber--;
            addLine("/* codechat */", "tag-bot", "error: could not reach the server", "msg-text-bot");
        }

        sendBtn.disabled = false;
        input.disabled = false;
        input.focus();
    }

    loadBtn.addEventListener("click", loadRepo);
    repoInput.addEventListener("keypress", (e) => { if (e.key === "Enter") loadRepo(); });
    sendBtn.addEventListener("click", sendQuestion);
    input.addEventListener("keypress", (e) => { if (e.key === "Enter") sendQuestion(); });
</script>

</body>
</html>
